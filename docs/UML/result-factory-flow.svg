<svg viewBox="0 0 860 730" xmlns="http://www.w3.org/2000/svg">
<g font-family="system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="flow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c8a24e"/></marker>
    <marker id="flow-ok" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#6f9a5a"/></marker>
    <marker id="flow-err" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c0563f"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="730" rx="0" fill="#161b23"/>

  <text x="20" y="26" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#c8a24e">Result&lt;T&gt; error handling &amp; distribution factory flows</text>

  <!-- Result<T> template -->
  <rect x="556" y="44" width="284" height="138" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="698" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Result&lt;T&gt; template</text>
  <line x1="564" y1="70" x2="832" y2="70" stroke="#c8a24e" stroke-width="0.75"/>
  <text x="570" y="86" font-size="9.5" fill="#161b23">T              value</text>
  <text x="570" y="101" font-size="9.5" fill="#161b23">ValidationError   error_code</text>
  <text x="570" y="116" font-size="9.5" fill="#161b23">std::string    message</text>
  <line x1="564" y1="123" x2="832" y2="123" stroke="#c8a24e" stroke-width="0.75"/>
  <text x="570" y="138" font-size="9.5" fill="#6b6455">bool isOk() / isError()</text>
  <text x="570" y="153" font-size="9.5" fill="#6b6455">static Result ok(T val)</text>
  <text x="570" y="168" font-size="9.5" fill="#6b6455">static Result makeError(code, msg)</text>

  <!-- ValidationError enum -->
  <rect x="556" y="194" width="284" height="100" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="698" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">ValidationError enum</text>
  <line x1="564" y1="219" x2="832" y2="219" stroke="#c8a24e" stroke-width="0.75"/>
  <text x="570" y="235" font-size="9.5" fill="#161b23">None · InvalidMean · InvalidStdDev</text>
  <text x="570" y="250" font-size="9.5" fill="#161b23">InvalidRange · InvalidParameter</text>
  <text x="570" y="265" font-size="9.5" fill="#161b23">UnknownError</text>
  <text x="570" y="282" font-size="8.5" fill="#6b6455">VoidResult = Result&lt;std::monostate&gt;</text>

  <!-- Four creation patterns -->
  <text x="20" y="58" font-size="12" font-weight="bold" fill="#c8a24e">Four creation patterns</text>

  <rect x="20" y="64" width="224" height="74" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="132" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#161b23">① Exception constructor</text>
  <text x="28" y="99" font-size="9.5" fill="#161b23">GaussianDistribution d(0.0, 1.0);</text>
  <text x="28" y="113" font-size="8.5" fill="#6b6455">throws std::invalid_argument</text>
  <text x="28" y="127" font-size="8.5" fill="#6b6455">if params are invalid</text>

  <rect x="20" y="150" width="224" height="92" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="132" y="168" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#161b23">② Result-based factory ★ preferred</text>
  <text x="28" y="185" font-size="9.5" fill="#161b23">auto r = Gaussian::create(0.0, 1.0);</text>
  <text x="28" y="199" font-size="9.5" fill="#161b23">if (r.isOk()) use(r.value);</text>
  <text x="28" y="213" font-size="9.5" fill="#161b23">else log(r.message);</text>
  <text x="28" y="230" font-size="8.5" fill="#6b6455">no-throw; preferred for library APIs</text>

  <rect x="20" y="254" width="224" height="74" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="132" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#161b23">③ Unchecked (private)</text>
  <text x="28" y="289" font-size="9.5" fill="#161b23">Gaussian::createUnchecked(m, s)</text>
  <text x="28" y="303" font-size="8.5" fill="#6b6455">bypasses validation; only called</text>
  <text x="28" y="317" font-size="8.5" fill="#6b6455">from create() after validation</text>

  <rect x="20" y="340" width="224" height="96" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="132" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#161b23">④ Specialized factories</text>
  <text x="28" y="375" font-size="9.5" fill="#161b23">Gamma::createWithScale(α, scale)</text>
  <text x="28" y="389" font-size="8.5" fill="#6b6455">  converts scale → rate β = 1/scale</text>
  <text x="28" y="406" font-size="9.5" fill="#161b23">Gamma::createFromMoments(μ, σ²)</text>
  <text x="28" y="420" font-size="8.5" fill="#6b6455">  MoM: α = μ²/σ²,  β = μ/σ²</text>

  <!-- create() call chain -->
  <text x="20" y="462" font-size="12" font-weight="bold" fill="#c8a24e">create() call chain (Pattern ②)</text>

  <rect x="20" y="476" width="140" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="90" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">caller</text>
  <text x="90" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">Gaussian::create(μ, σ)</text>

  <line x1="160" y1="496" x2="200" y2="496" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="200" y="476" width="190" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="295" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">validateGaussianParams(μ, σ)</text>
  <text x="295" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">returns VoidResult</text>

  <!-- error branch -->
  <text x="210" y="524" font-size="8.5" fill="#c0563f">error</text>
  <line x1="295" y1="516" x2="295" y2="530" stroke="#c0563f" stroke-width="1.6"/>
  <line x1="295" y1="530" x2="150" y2="530" stroke="#c0563f" stroke-width="1.6"/>
  <line x1="150" y1="530" x2="150" y2="560" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <rect x="20" y="560" width="260" height="40" rx="7" fill="#e7e0cf" stroke="#c0563f" stroke-width="1.2"/>
  <text x="150" y="576" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">Result::makeError(code, msg)</text>
  <text x="150" y="590" text-anchor="middle" font-size="9.5" fill="#161b23">isError()=true · value unset</text>

  <!-- ok branch -->
  <text x="405" y="490" font-size="8.5" fill="#6f9a5a">ok</text>
  <line x1="390" y1="496" x2="430" y2="496" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>

  <rect x="430" y="476" width="210" height="40" rx="7" fill="#e7e0cf" stroke="#6f9a5a" stroke-width="1.2"/>
  <text x="535" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">createUnchecked(μ, σ)</text>
  <text x="535" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">private ctor, bypass-validation tag</text>

  <line x1="640" y1="496" x2="670" y2="496" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>

  <rect x="670" y="476" width="170" height="40" rx="7" fill="#e7e0cf" stroke="#6f9a5a" stroke-width="1.2"/>
  <text x="755" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">Result::ok(std::move(dist))</text>
  <text x="755" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">isOk()=true · value ready</text>

  <!-- trySet family note -->
  <rect x="20" y="616" width="820" height="20" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="430" y="630" text-anchor="middle" font-size="8.5" fill="#6b6455">Post-construction mutation: trySetMean(v) / trySetStdDev(v) / trySetParameters(μ,σ)  →  VoidResult  (no-throw).  Throwing setMean(v) / setStdDev(v) also available.</text>

  <!-- Legend -->
  <rect x="20" y="656" width="250" height="54" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <line x1="34" y1="670" x2="74" y2="670" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="82" y="674" font-size="8.5" fill="#161b23">flow</text>
  <line x1="34" y1="684" x2="74" y2="684" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>
  <text x="82" y="688" font-size="8.5" fill="#161b23">ok path</text>
  <line x1="34" y1="698" x2="74" y2="698" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <text x="82" y="702" font-size="8.5" fill="#161b23">error path</text>

  <text x="840" y="702" text-anchor="end" font-size="9.5" fill="#9a9382">libstats v2.4.0  ·  docs/UML/result-factory-flow.svg</text>
</g>
</svg>
