<svg viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg">
<g font-family="system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="flow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c8a24e"/></marker>
    <marker id="flow-ok" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#6f9a5a"/></marker>
    <marker id="flow-err" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c0563f"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="700" rx="0" fill="#161b23"/>

  <text x="20" y="26" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#c8a24e">Thread safety &amp; cache model</text>

  <!-- Distribution object band -->
  <rect x="20" y="44" width="820" height="214" rx="12" fill="#232a36" stroke="#c8a24e" stroke-width="1.5"/>
  <text x="34" y="68" font-size="11.5" font-weight="bold" letter-spacing="0.5" fill="#c8a24e">DISTRIBUTION OBJECT (E.G. GAUSSIANDISTRIBUTION)</text>

  <!-- Parameters card -->
  <rect x="32" y="96" width="184" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="124" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Parameters</text>
  <text x="124" y="131" text-anchor="middle" font-size="9.5" fill="#161b23">mean_ : double</text>
  <text x="124" y="146" text-anchor="middle" font-size="9.5" fill="#161b23">standardDeviation_ : double</text>
  <text x="40" y="166" font-size="8.5" fill="#6b6455">guarded by cache_mutex_</text>
  <text x="40" y="180" font-size="8.5" fill="#6b6455">(std::shared_mutex)</text>
  <text x="40" y="194" font-size="8.5" fill="#6b6455">reads: shared_lock</text>

  <!-- Atomic fast path card -->
  <rect x="228" y="96" width="184" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="320" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Atomic fast path</text>
  <text x="320" y="131" text-anchor="middle" font-size="9.5" fill="#161b23">atomicMean_ : atomic&lt;double&gt;</text>
  <text x="320" y="146" text-anchor="middle" font-size="9.5" fill="#161b23">atomicStdDev_ : atomic&lt;double&gt;</text>
  <text x="320" y="161" text-anchor="middle" font-size="9.5" fill="#161b23">atomicParamsValid_ : atomic&lt;bool&gt;</text>
  <text x="236" y="181" font-size="8.5" fill="#6b6455">lock-free reads when valid</text>
  <text x="236" y="195" font-size="8.5" fill="#6b6455">~2–5 ns vs ~50–100 ns locked</text>

  <!-- Computed cache card -->
  <rect x="424" y="96" width="224" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="536" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Computed cache (mutable)</text>
  <text x="536" y="127" text-anchor="middle" font-size="8.5" fill="#161b23">normalizationConstant_</text>
  <text x="536" y="140" text-anchor="middle" font-size="8.5" fill="#161b23">negHalfSigmaSquaredInv_</text>
  <text x="536" y="153" text-anchor="middle" font-size="8.5" fill="#161b23">logStdDev_ sigmaSqrt2_ invStdDev_</text>
  <text x="536" y="166" text-anchor="middle" font-size="8.5" fill="#161b23">cachedSigmaSquared_</text>
  <text x="536" y="179" text-anchor="middle" font-size="8.5" fill="#161b23">cachedLogTwoSigmaSquared_</text>
  <text x="432" y="195" font-size="8.5" fill="#6b6455">8 derived values (Gaussian example)</text>
  <text x="432" y="208" font-size="8.5" fill="#6b6455">lazy — rebuilt by updateCacheUnsafe()</text>

  <!-- Validity flags card -->
  <rect x="660" y="96" width="168" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="744" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Validity flags</text>
  <text x="744" y="132" text-anchor="middle" font-size="9.5" fill="#161b23">cache_valid_ : bool</text>
  <text x="744" y="146" text-anchor="middle" font-size="8.5" fill="#6b6455">(plain; requires lock)</text>
  <text x="744" y="164" text-anchor="middle" font-size="9.5" fill="#161b23">cacheValidAtomic_</text>
  <text x="744" y="178" text-anchor="middle" font-size="9.5" fill="#161b23">  : atomic&lt;bool&gt;</text>
  <text x="744" y="192" text-anchor="middle" font-size="8.5" fill="#6b6455">(lock-free hint)</text>

  <!-- Read flow -->
  <text x="20" y="282" font-size="11" font-weight="bold" fill="#c8a24e">Read flow (getMeanAtomic / getProbability)</text>

  <rect x="20" y="296" width="160" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="100" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">caller thread</text>
  <text x="100" y="326" text-anchor="middle" font-size="9.5" fill="#161b23">getMeanAtomic()</text>

  <line x1="180" y1="316" x2="222" y2="316" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <polygon points="250,316 320,296 390,316 320,336" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="320" y="312" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">atomicParams</text>
  <text x="320" y="325" text-anchor="middle" font-size="9.5" fill="#161b23">Valid.load()?</text>

  <!-- YES / lock-free -->
  <text x="398" y="289" font-size="8.5" fill="#6f9a5a">YES — lock-free</text>
  <line x1="390" y1="316" x2="440" y2="316" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>
  <rect x="440" y="296" width="200" height="40" rx="7" fill="#e7e0cf" stroke="#6f9a5a" stroke-width="1.2"/>
  <text x="540" y="312" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">return atomicMean_</text>
  <text x="540" y="326" text-anchor="middle" font-size="9.5" fill="#161b23">.load(memory_order_acquire)</text>

  <!-- NO / contention -->
  <text x="330" y="356" font-size="8.5" fill="#c0563f">NO — acquire lock</text>
  <line x1="320" y1="336" x2="320" y2="372" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <rect x="176" y="372" width="288" height="64" rx="7" fill="#e7e0cf" stroke="#c0563f" stroke-width="1.2"/>
  <text x="320" y="390" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">shared_lock(cache_mutex_)</text>
  <text x="320" y="406" text-anchor="middle" font-size="9.5" fill="#161b23">if !cache_valid_: upgrade → unique_lock</text>
  <text x="320" y="422" text-anchor="middle" font-size="9.5" fill="#161b23">call updateCacheUnsafe() → set both flags</text>

  <!-- Write flow -->
  <text x="20" y="460" font-size="11" font-weight="bold" fill="#c8a24e">Write flow (setMean)</text>

  <rect x="20" y="476" width="140" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="90" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">caller thread</text>
  <text x="90" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">setMean(newVal)</text>

  <line x1="160" y1="496" x2="200" y2="496" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="200" y="476" width="190" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="295" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">validateParameters()</text>
  <text x="295" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">throws invalid_argument if bad</text>

  <line x1="390" y1="496" x2="430" y2="496" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="430" y="476" width="210" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="535" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">unique_lock(cache_mutex_)</text>
  <text x="535" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">mean_ = newVal · invalidateCache()</text>

  <line x1="640" y1="496" x2="660" y2="496" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="660" y="476" width="180" height="54" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="750" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">invalidateCache()</text>
  <text x="750" y="506" text-anchor="middle" font-size="9.5" fill="#161b23">cache_valid_ = false</text>
  <text x="750" y="520" text-anchor="middle" font-size="9.5" fill="#161b23">atomic.store(false, release)</text>

  <!-- Move safety note -->
  <rect x="20" y="546" width="820" height="76" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="430" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Move &amp; copy safety</text>
  <text x="430" y="578" text-anchor="middle" font-size="9.5" fill="#161b23">Move constructor and assignment use std::lock(lock1, lock2) with std::defer_lock — acquires both mutexes in</text>
  <text x="430" y="592" text-anchor="middle" font-size="9.5" fill="#161b23">consistent address order to prevent deadlock when two distributions are moved by different threads simultaneously.</text>
  <text x="430" y="608" text-anchor="middle" font-size="8.5" fill="#6b6455">Both are noexcept — required for STL container resize, std::sort, move-only semantics. Source left in valid-but-reset state.</text>

  <!-- Legend -->
  <rect x="20" y="638" width="250" height="54" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <line x1="34" y1="652" x2="74" y2="652" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="82" y="656" font-size="8.5" fill="#161b23">flow</text>
  <line x1="34" y1="666" x2="74" y2="666" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>
  <text x="82" y="670" font-size="8.5" fill="#161b23">ok / fast path</text>
  <line x1="34" y1="680" x2="74" y2="680" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <text x="82" y="684" font-size="8.5" fill="#161b23">error / contention</text>

  <text x="840" y="684" text-anchor="end" font-size="9.5" fill="#9a9382">libstats v2.4.0  ·  docs/UML/thread-safety-cache.svg</text>
</g>
</svg>
