<svg viewBox="0 0 860 768" xmlns="http://www.w3.org/2000/svg">
<g font-family="system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="flow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c8a24e"/></marker>
    <marker id="flow-ok" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#6f9a5a"/></marker>
    <marker id="flow-err" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#c0563f"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="768" rx="0" fill="#161b23"/>

  <text x="20" y="26" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#c8a24e">Thread safety &amp; cache model</text>

  <!-- Distribution object band -->
  <rect x="20" y="44" width="820" height="214" rx="12" fill="#232a36" stroke="#c8a24e" stroke-width="1.5"/>
  <text x="34" y="68" font-size="11.5" font-weight="bold" letter-spacing="0.5" fill="#c8a24e">DISTRIBUTION OBJECT (E.G. GAUSSIANDISTRIBUTION)</text>

  <!-- Parameters card -->
  <rect x="28" y="96" width="164" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="110" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Parameters</text>
  <text x="110" y="131" text-anchor="middle" font-size="9.5" fill="#161b23">mean_ : double</text>
  <text x="110" y="146" text-anchor="middle" font-size="9.5" fill="#161b23">standardDeviation_ : double</text>
  <text x="36" y="166" font-size="8.5" fill="#6b6455">guarded by cache_mutex_</text>
  <text x="36" y="180" font-size="8.5" fill="#6b6455">(std::shared_mutex)</text>
  <text x="36" y="194" font-size="8.5" fill="#6b6455">reads: shared_lock</text>
  <text x="36" y="208" font-size="8.5" fill="#6b6455">writes: unique_lock</text>

  <!-- Atomic fast path card -->
  <rect x="204" y="96" width="200" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="304" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Atomic fast path</text>
  <text x="304" y="131" text-anchor="middle" font-size="9.5" fill="#161b23">atomicMean_</text>
  <text x="304" y="146" text-anchor="middle" font-size="9.5" fill="#161b23">atomicStandardDeviation_</text>
  <text x="304" y="161" text-anchor="middle" font-size="9.5" fill="#161b23">atomicParamsValid_</text>
  <text x="304" y="177" text-anchor="middle" font-size="8.5" fill="#6b6455">two atomic&lt;double&gt; + one atomic&lt;bool&gt;</text>
  <text x="212" y="196" font-size="8.5" fill="#6b6455">lock-free reads when valid</text>
  <text x="212" y="210" font-size="8.5" fill="#6b6455">~2–5 ns vs ~50–100 ns locked</text>

  <!-- Computed cache card -->
  <rect x="416" y="96" width="240" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="536" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Computed cache (mutable)</text>
  <text x="536" y="127" text-anchor="middle" font-size="8.5" fill="#161b23">invStandardDeviation_ · cachedSqrtTwoPi_</text>
  <text x="536" y="138" text-anchor="middle" font-size="8.5" fill="#161b23">negHalfSigmaSquaredInv_ · sigmaSqrt2_</text>
  <text x="536" y="149" text-anchor="middle" font-size="8.5" fill="#161b23">normalizationConstant_ · cachedSigmaSquared_</text>
  <text x="536" y="160" text-anchor="middle" font-size="8.5" fill="#161b23">logStandardDeviation_</text>
  <text x="536" y="171" text-anchor="middle" font-size="8.5" fill="#161b23">cachedTwoSigmaSquared_</text>
  <text x="536" y="182" text-anchor="middle" font-size="8.5" fill="#161b23">cachedLogTwoSigmaSquared_</text>
  <text x="536" y="193" text-anchor="middle" font-size="8.5" fill="#161b23">cachedInvSigmaSquared_</text>
  <text x="424" y="209" font-size="8.5" fill="#6b6455">10 derived values (Gaussian example)</text>
  <text x="424" y="221" font-size="8.5" fill="#6b6455">lazy — rebuilt by updateCacheUnsafe()</text>
  <text x="424" y="233" font-size="8.5" fill="#6b6455">(which also refreshes the atomic copies)</text>

  <!-- Validity flags card -->
  <rect x="668" y="96" width="164" height="146" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="750" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Validity flags</text>
  <text x="750" y="132" text-anchor="middle" font-size="9.5" fill="#161b23">cache_valid_ : bool</text>
  <text x="750" y="146" text-anchor="middle" font-size="8.5" fill="#6b6455">(plain; requires lock)</text>
  <text x="750" y="164" text-anchor="middle" font-size="9.5" fill="#161b23">cacheValidAtomic_ :</text>
  <text x="750" y="178" text-anchor="middle" font-size="9.5" fill="#161b23">CacheValidFlag</text>
  <text x="750" y="192" text-anchor="middle" font-size="8.5" fill="#6b6455">(atomic&lt;bool&gt; + generation)</text>
  <text x="750" y="206" text-anchor="middle" font-size="8.5" fill="#6b6455">lock-free hint; each store</text>
  <text x="750" y="218" text-anchor="middle" font-size="8.5" fill="#6b6455">advances the generation</text>

  <!-- Read flow -->
  <text x="20" y="282" font-size="11" font-weight="bold" fill="#c8a24e">Read flow (getMeanAtomic; getProbability via withCacheSnapshot)</text>

  <rect x="20" y="296" width="160" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="100" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">caller thread</text>
  <text x="100" y="326" text-anchor="middle" font-size="9.5" fill="#161b23">getMeanAtomic()</text>

  <line x1="180" y1="316" x2="249" y2="316" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <polygon points="250,316 320,296 390,316 320,336" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="320" y="312" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">atomicParams</text>
  <text x="320" y="325" text-anchor="middle" font-size="9.5" fill="#161b23">Valid.load()?</text>

  <!-- YES / lock-free -->
  <text x="398" y="289" font-size="8.5" fill="#6f9a5a">YES — lock-free</text>
  <line x1="390" y1="316" x2="440" y2="316" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>
  <rect x="440" y="296" width="200" height="40" rx="7" fill="#e7e0cf" stroke="#6f9a5a" stroke-width="1.2"/>
  <text x="540" y="312" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">return atomicMean_</text>
  <text x="540" y="326" text-anchor="middle" font-size="9.5" fill="#161b23">.load(memory_order_acquire)</text>

  <!-- NO / contention -->
  <text x="330" y="356" font-size="8.5" fill="#c0563f">NO — locked fallback</text>
  <line x1="320" y1="336" x2="320" y2="372" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <rect x="176" y="372" width="288" height="48" rx="7" fill="#e7e0cf" stroke="#c0563f" stroke-width="1.2"/>
  <text x="320" y="390" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">return getMean()</text>
  <text x="320" y="406" text-anchor="middle" font-size="9.5" fill="#161b23">shared_lock(cache_mutex_) · read mean_</text>

  <!-- withCacheSnapshot panel -->
  <rect x="490" y="352" width="350" height="110" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="665" y="368" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">withCacheSnapshot(fn)  (getProbability, batch lambdas)</text>
  <text x="500" y="384" font-size="9.5" fill="#161b23">1. shared_lock; if cache_valid_: fn(), return</text>
  <text x="500" y="398" font-size="9.5" fill="#161b23">2. else release the shared_lock, take unique_lock</text>
  <text x="500" y="412" font-size="9.5" fill="#161b23">3. re-check !cache_valid_ → updateCacheUnsafe()</text>
  <text x="500" y="426" font-size="9.5" fill="#161b23">4. fn() copies the members under the lock</text>
  <text x="500" y="444" font-size="8.5" fill="#6b6455">readConsistent(fn), v2.5.0: re-runs fn while the CacheValidFlag</text>
  <text x="500" y="456" font-size="8.5" fill="#6b6455">generation moves, so one call sees one parameter state</text>

  <!-- Write flow -->
  <text x="20" y="480" font-size="11" font-weight="bold" fill="#c8a24e">Write flow (setMean)</text>

  <rect x="20" y="494" width="130" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="85" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">caller thread</text>
  <text x="85" y="524" text-anchor="middle" font-size="9.5" fill="#161b23">setMean(newVal)</text>

  <line x1="150" y1="514" x2="176" y2="514" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="176" y="494" width="190" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="271" y="510" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">unique_lock(cache_mutex_)</text>
  <text x="271" y="524" text-anchor="middle" font-size="9.5" fill="#161b23">validation runs under it (#183)</text>

  <line x1="366" y1="514" x2="392" y2="514" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="392" y="494" width="190" height="40" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="487" y="510" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">validateParameters(mean, σ_)</text>
  <text x="487" y="524" text-anchor="middle" font-size="9.5" fill="#161b23">throws invalid_argument if bad</text>

  <line x1="582" y1="514" x2="608" y2="514" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="608" y="494" width="232" height="66" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <text x="724" y="509" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#161b23">mean_ = newVal · clear flags inline</text>
  <text x="724" y="523" text-anchor="middle" font-size="8.5" fill="#161b23">cache_valid_ = false</text>
  <text x="724" y="536" text-anchor="middle" font-size="8.5" fill="#161b23">cacheValidAtomic_.store(false, release)</text>
  <text x="724" y="549" text-anchor="middle" font-size="8.5" fill="#161b23">atomicParamsValid_.store(false, release)</text>

  <!-- Move & copy safety note -->
  <rect x="20" y="578" width="820" height="96" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="430" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#161b23">Move &amp; copy safety</text>
  <text x="430" y="610" text-anchor="middle" font-size="9.5" fill="#161b23">Both assignments lock both mutexes with std::lock(lock1, lock2) over std::defer_lock — no deadlock, whichever thread locks first.</text>
  <text x="430" y="624" text-anchor="middle" font-size="9.5" fill="#161b23">Copy assignment: unique_lock(this) + shared_lock(source).  Move assignment (#184): unique_lock on both, the source is written.</text>
  <text x="430" y="638" text-anchor="middle" font-size="9.5" fill="#161b23">Copy constructor: shared_lock(source).  Move constructor: no lock.  A moved-from source resets to μ = 0, σ = 1, flags cleared.</text>
  <text x="430" y="656" text-anchor="middle" font-size="8.5" fill="#6b6455">Move constructor and move assignment are noexcept (STL container resize, std::sort); copy assignment is not.</text>

  <!-- Legend -->
  <rect x="20" y="690" width="250" height="54" rx="7" fill="#e7e0cf" stroke="#c8a24e" stroke-width="1.2"/>
  <line x1="34" y1="704" x2="74" y2="704" stroke="#c8a24e" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="82" y="708" font-size="8.5" fill="#161b23">flow</text>
  <line x1="34" y1="718" x2="74" y2="718" stroke="#6f9a5a" stroke-width="1.6" marker-end="url(#flow-ok)"/>
  <text x="82" y="722" font-size="8.5" fill="#161b23">ok / fast path</text>
  <line x1="34" y1="732" x2="74" y2="732" stroke="#c0563f" stroke-width="1.6" marker-end="url(#flow-err)"/>
  <text x="82" y="736" font-size="8.5" fill="#161b23">error / contention</text>

  <text x="840" y="736" text-anchor="end" font-size="9.5" fill="#9a9382">libstats v2.5.0  ·  docs/UML/thread-safety-cache.svg</text>
</g>
</svg>
