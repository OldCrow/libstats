name: CI

on:
  push:
    branches: [ main, develop, 'release/*', 'v*' ]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # Weekly canary: catches drift with no code change to trigger it (runner
  # image rolls, toolchain updates) instead of discovering breakage at the
  # next real push.
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Release build per platform/compiler. Debug legs were dropped (they
  # duplicated Release coverage without gating on warnings); the
  # strict-warnings job below uses the existing Strict build type (-Werror)
  # to catch what Debug builds never actually enforced.
  #
  # Runner labels follow CI House Style §1: a leg that installs a versioned
  # tool (gcc-14, clang-17) pins its image, so the image and the tool move
  # together in one deliberate commit; the macOS and Windows legs take the
  # image's own compiler and float.
  build:
    name: Build ${{ matrix.os }} ${{ matrix.compiler.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: { name: gcc-14,  cc: gcc-14,  cxx: g++-14  }, build_type: Release }
          - { os: ubuntu-24.04, compiler: { name: clang-17, cc: clang-17, cxx: clang++-17 }, build_type: Release }
          - { os: macos-latest,  compiler: { name: AppleClang, cc: clang, cxx: clang++ }, build_type: Release }
          - { os: windows-latest, compiler: { name: msvc, cc: cl, cxx: cl }, build_type: Release }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows' && matrix.compiler.name == 'msvc'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Install compiler (Ubuntu)
      if: runner.os == 'Linux'
      env:
        CC_PKG: ${{ matrix.compiler.cc }}
        CXX_PKG: ${{ matrix.compiler.cxx }}
      run: |
        sudo apt-get update
        if [[ "$CC_PKG" == gcc* ]]; then
          sudo apt-get install -y "$CC_PKG" "$CXX_PKG"
        elif [[ "$CC_PKG" == clang* ]]; then
          sudo apt-get install -y "$CC_PKG"
        fi

    - name: Setup compiler environment
      if: runner.os != 'Windows' || matrix.compiler.name != 'msvc'
      env:
        CC_VAL: ${{ matrix.compiler.cc }}
        CXX_VAL: ${{ matrix.compiler.cxx }}
      run: |
        echo "CC=$CC_VAL" >> "$GITHUB_ENV"
        echo "CXX=$CXX_VAL" >> "$GITHUB_ENV"

    - name: Configure CMake (Windows MSVC)
      if: runner.os == 'Windows' && matrix.compiler.name == 'msvc'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_STANDARD=20 -A x64

    - name: Configure CMake (Non-Windows or Non-MSVC)
      if: runner.os != 'Windows' || matrix.compiler.name != 'msvc'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_STANDARD=20

    - name: Build
      shell: bash
      run: |
        # Compute a memory-aware parallel job count.
        # Heavy C++ Release builds (lambdas, templates) can use 1.5–2 GB per
        # compiler process. GitHub-hosted ubuntu-latest has 7 GB total RAM
        # and 2 vCPUs; macOS has 14 GB and 3 vCPUs; Windows has 7 GB and 2 vCPUs.
        # We derive JOBS = min(cpu_count, floor(avail_mem_gb / 2)) so that memory
        # pressure never causes OOM, while still using the full CPU count when RAM
        # is healthy (the common case on macOS and Debug builds everywhere).
        if [ "${{ runner.os }}" == "Linux" ]; then
          MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
          CPU=$(nproc 2>/dev/null || echo 2)
          MEM_JOBS=$(( MEM_GB / 2 ))
          JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        elif [ "${{ runner.os }}" == "macOS" ]; then
          # macOS runners have 14 GB; use the full logical CPU count.
          JOBS=$(sysctl -n hw.logicalcpu 2>/dev/null || echo 3)
        else
          # Windows: NUMBER_OF_PROCESSORS is always set.
          JOBS="${NUMBER_OF_PROCESSORS:-2}"
        fi
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build --config ${{ matrix.build_type }} --parallel "${JOBS}"

    - name: Setup Windows DLL paths
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Add DLL directories to PATH for Windows
        echo "Adding DLL directories to PATH..."

        # Convert to Windows paths and add to PATH
        if [ -d "build/${{ matrix.build_type }}" ]; then
          WIN_PATH=$(cygpath -w "${{ github.workspace }}/build/${{ matrix.build_type }}" 2>/dev/null || printf '%s' "${{ github.workspace }}\\build\\${{ matrix.build_type }}")
          echo "$WIN_PATH" >> "$GITHUB_PATH"
        fi

        if [ -d "build/tests/${{ matrix.build_type }}" ]; then
          WIN_PATH=$(cygpath -w "${{ github.workspace }}/build/tests/${{ matrix.build_type }}" 2>/dev/null || printf '%s' "${{ github.workspace }}\\build\\tests\\${{ matrix.build_type }}")
          echo "$WIN_PATH" >> "$GITHUB_PATH"
        fi

        # Also add the main build directory
        WIN_PATH=$(cygpath -w "${{ github.workspace }}/build" 2>/dev/null || printf '%s' "${{ github.workspace }}\\build")
        echo "$WIN_PATH" >> "$GITHUB_PATH"

        # Copy DLLs as a fallback
        if [ -f "build/${{ matrix.build_type }}/libstats.dll" ]; then
          cp "build/${{ matrix.build_type }}/libstats.dll" "build/tests/${{ matrix.build_type }}/" || true
          echo "Copied libstats.dll to build/tests/${{ matrix.build_type }}/"
        fi
        if [ -f "build/Release/libstats.dll" ]; then
          cp "build/Release/libstats.dll" "build/tests/Release/" || true
        fi
        if [ -f "build/Debug/libstats.dll" ]; then
          cp "build/Debug/libstats.dll" "build/tests/Debug/" || true
        fi

    - name: Test
      working-directory: build
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          # On Windows, ensure PATH includes DLL directories
          export PATH="${{ github.workspace }}/build/${{ matrix.build_type }}:${{ github.workspace }}/build/tests/${{ matrix.build_type }}:${{ github.workspace }}/build:$PATH"
        fi
        # Exclude timing and benchmark tests: speedup assertions require a quiet
        # dedicated machine and serial execution. Run them locally with -j1 -L timing.
        ctest -C ${{ matrix.build_type }} --output-on-failure --parallel -LE "timing|benchmark"

    - name: Benchmark (Release only)
      if: matrix.build_type == 'Release'
      shell: bash
      run: |
        if [ -f "build/tools/system_inspector" ]; then
          ./build/tools/system_inspector --quick
        fi
        if [ -f "build/examples/gaussian_performance_benchmark" ]; then
          timeout 30 ./build/examples/gaussian_performance_benchmark || true
        fi

    # -------------------------------------------------------------------------
    # Install-contract smoke test — Linux/GCC/Release leg only (cheapest
    # runner; exercises the installed-package path via find_package + pkg-config).
    # -------------------------------------------------------------------------
    - name: Install to prefix
      if: runner.os == 'Linux' && matrix.compiler.name == 'gcc-14' && matrix.build_type == 'Release'
      run: cmake --install build --prefix "$GITHUB_WORKSPACE/_install"

    - name: Configure consumer_example against installed prefix
      if: runner.os == 'Linux' && matrix.compiler.name == 'gcc-14' && matrix.build_type == 'Release'
      run: |
        cmake -S consumer_example -B consumer_example/build \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"

    - name: Build and run consumer_example
      if: runner.os == 'Linux' && matrix.compiler.name == 'gcc-14' && matrix.build_type == 'Release'
      run: |
        cmake --build consumer_example/build
        ./consumer_example/build/consumer_demo

    - name: pkg-config smoke test
      if: runner.os == 'Linux' && matrix.compiler.name == 'gcc-14' && matrix.build_type == 'Release'
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/_install/lib/pkgconfig"
        pkg-config --exists --print-errors libstats
        pkg-config --cflags --libs libstats

  # ---------------------------------------------------------------------------
  # ASan+UBSan together in one Linux job (corvus/ewcalc pattern) rather than
  # separate runners per sanitizer.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/UBSan, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Build only the library + test targets under instrumentation. The Test
    # step runs ctest, so examples/tools/benchmarks add heavy instrumented
    # compile time for no coverage gain — disabling them keeps this job inside
    # its timeout (the full instrumented build previously timed out at 20 min).
    - name: Configure (ASan + UBSan)
      run: |
        cmake -B build-san \
          -DCMAKE_BUILD_TYPE=Debug \
          -DLIBSTATS_BUILD_TOOLS=OFF \
          -DLIBSTATS_BUILD_EXAMPLES=OFF \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    # Bound parallelism to memory, not just CPU. Bare `--parallel` passes
    # `make -j` with no limit, spawning a compile per ready target; under
    # ASan+UBSan instrumentation (roughly 2x memory) that OOM-kills the 7 GB
    # runner (exit 143, "runner received a shutdown signal") within minutes.
    # Use mem/3 here (vs mem/2 for the uninstrumented matrix build) for the
    # instrumentation overhead.
    - name: Build
      shell: bash
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 3 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-san --parallel "${JOBS}"

    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --test-dir build-san --output-on-failure -LE "timing|benchmark"

  # ---------------------------------------------------------------------------
  # Strict warnings gate — replaces the old gcc-13/Windows Debug matrix legs.
  # Uses the Strict build type already defined in CMakeLists.txt (-Werror +
  # per-compiler strict warning sets); compile-only, no test run needed.
  # ---------------------------------------------------------------------------
  strict-warnings:
    name: Strict warnings (Linux, -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Configure (Strict)
      run: cmake -B build-strict -DCMAKE_BUILD_TYPE=Strict

    # Bound parallelism to memory (same reason as the Sanitizers/matrix jobs):
    # bare `--parallel` is an unlimited `make -j` that OOM-kills the 7 GB
    # runner (exit 143) mid-build. mem/2 matches the uninstrumented matrix.
    - name: Build
      shell: bash
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 2 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-strict --parallel "${JOBS}"

  # ThreadSanitizer over the correctness suite. The concurrency fixes (#175, #176, #183, #184,
  # #186, #190, #191, the ee11e62 audit) were each shown with TSan or the stress test on the Macs;
  # without this leg only the stress test's value checks guarded them in CI. Any report fails the
  # job (halt_on_error). The stress test runs at a tenth of its rounds (LIBSTATS_STRESS_SCALE),
  # as R9 ran it locally. Linux takes PARALLEL, not WORK_STEALING, so the work-stealing lambdas
  # are checked on SMT Macs (R9), not here.
  thread-sanitizer:
    name: ThreadSanitizer (Linux, clang-17)
    runs-on: ubuntu-24.04  # pinned: installs versioned tools
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install clang-17
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-17
    # Ubuntu 24.04's kernels map with 32 bits of ASLR entropy, more than TSan before LLVM 18
    # supports ("FATAL: ThreadSanitizer: unexpected memory mapping"); 28 is the old default.
    - name: Lower ASLR entropy for TSan
      run: sudo sysctl vm.mmap_rnd_bits=28
    - name: Configure (-fsanitize=thread)
      env:
        CC: clang-17
        CXX: clang++-17
      run: |
        cmake -B build-tsan \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLIBSTATS_BUILD_TOOLS=OFF \
          -DLIBSTATS_BUILD_EXAMPLES=OFF \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

    # Instrumented builds need more memory per job: mem/3, as the Sanitizers job.
    - name: Build
      shell: bash
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 3 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-tsan --parallel "${JOBS}"

    - name: Test
      env:
        LIBSTATS_STRESS_SCALE: "0.1"
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/tsan.supp
      run: ctest --test-dir build-tsan --output-on-failure -LE "timing|benchmark" --parallel 2

  # ---------------------------------------------------------------------------
  # FMA contraction (Linux, clang-17, -mfma -ffp-contract=on). The x86 legs build
  # the generic sources without FMA, so a contracted a*b + c is only ever seen on
  # the macOS runner (AArch64, where AppleClang contracts by default) — that
  # is where 08d48aa's Gamma batch double-counted its rate-product rounding.
  # This leg reproduces AppleClang-AArch64 and clang-cl-with-FMA contraction on
  # Linux, so the defect class fails here too, with a readable log. Correctness
  # run only; tools and examples off for time.
  # ---------------------------------------------------------------------------
  fma-contraction:
    name: FMA contraction (Linux, clang-17)
    runs-on: ubuntu-24.04  # pinned: installs versioned tools
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install clang-17
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-17
    - name: Configure (-mfma -ffp-contract=on)
      env:
        CC: clang-17
        CXX: clang++-17
      run: |
        cmake -B build-fma \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBSTATS_BUILD_TOOLS=OFF \
          -DLIBSTATS_BUILD_EXAMPLES=OFF \
          -DCMAKE_CXX_FLAGS="-mfma -ffp-contract=on"

    # Bound parallelism to memory (same reason as the Sanitizers/matrix jobs).
    - name: Build
      shell: bash
      run: |
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 2 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build-fma --parallel "${JOBS}"

    - name: Test
      run: ctest --test-dir build-fma --output-on-failure -LE "timing|benchmark"

  # Guards generator-specific defects in the files CMake GENERATES, which the
  # rest of CI cannot see: every other job configures with plain `cmake -B`
  # and no -G, so Windows gets Visual Studio and Linux gets Makefiles. Ninja
  # is exercised nowhere else, and CMakePresets.json pins no generator either.
  #
  # This existed because of #94: a literal `$` in the run_tests ctest regex
  # (the target is run_tests_correctness since v2.5.0)
  # reached build.ninja unescaped (Ninja requires `$$`), and the malformed
  # line invalidated the ENTIRE build.ninja, so nothing built. It went
  # unnoticed for as long as it did precisely because no job ran Ninja.
  #
  # Deliberately does not compile anything. The defect class is malformed
  # GENERATED build files, and configure alone does not catch it -- #94
  # configured cleanly and failed only when ninja parsed the result. Forcing
  # a parse plus a full dry-run graph resolution covers the class exactly,
  # in seconds rather than the minutes a real build would cost.
  ninja-generator:
    name: Ninja generator (Linux, configure + parse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Ensure ninja is available
      run: command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }

    # Tests MUST be enabled (the default). run_tests_correctness lives in
    # tests/CMakeLists.txt, so building without tests would omit the very
    # target whose generated command carries the escaping hazard, and this
    # job would pass while guarding nothing.
    - name: Configure with Ninja
      run: cmake -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release

    # `ninja -t targets` reads build.ninja end to end and fails on malformed
    # syntax -- this is the check that would have caught #94.
    - name: Parse the generated build.ninja
      run: ninja -C build-ninja -t targets > /dev/null

    # Dry run resolves the whole dependency graph without compiling, so a
    # command that is syntactically valid but references a broken rule or a
    # missing input still fails here.
    - name: Resolve the build graph (dry run)
      run: ninja -C build-ninja -n > /dev/null

  # ---------------------------------------------------------------------------
  # #90 guard. Imported targets are not cache-persistent, so a second configure
  # pass over an existing build dir can quietly produce a different installed
  # export than the first. Every other job configures exactly once and is blind
  # to it. Configure-only -- install(EXPORT) writes the export file at GENERATE
  # time under CMakeFiles/Export/, so nothing needs to be compiled to see it.
  # Linux specifically: pthreads are a real dependency here, where on macOS they
  # live in libSystem and on Windows the path is not taken at all, so this is the
  # only leg where the symptom is visible.
  # ---------------------------------------------------------------------------
  reconfigure-export:
    name: Export stability across reconfigure (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure (first pass)
      run: cmake -B build-recfg -DCMAKE_BUILD_TYPE=Release

    - name: Capture the generated export
      run: cp build-recfg/CMakeFiles/Export/*/libstats-targets.cmake /tmp/pass1.cmake

    # Any second configure reproduces it; the extra -D just makes the intent
    # explicit and guarantees CMake does not short-circuit the pass.
    - name: Reconfigure the same build directory
      run: cmake -B build-recfg -DLIBSTATS_VERBOSE_BUILD=ON

    - name: Capture the export again
      run: cp build-recfg/CMakeFiles/Export/*/libstats-targets.cmake /tmp/pass2.cmake

    - name: Export must not depend on configure count
      run: |
        if ! diff -u /tmp/pass1.cmake /tmp/pass2.cmake; then
          echo "::error::Installed export differs between the first and second configure pass (#90)."
          exit 1
        fi

    # The diff above catches the general class; this pins the specific
    # regression, so a future change that drops Threads::Threads from BOTH
    # passes cannot slip through as "stable".
    - name: Threads::Threads must survive into the export
      run: |
        for f in /tmp/pass1.cmake /tmp/pass2.cmake; do
          if ! grep -q 'Threads::Threads' "$f"; then
            echo "::error::$f has no Threads::Threads in INTERFACE_LINK_LIBRARIES (#90)."
            exit 1
          fi
        done

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-24.04  # pinned: installs versioned tools
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-17 clang-tidy-17 cppcheck

    - name: Check formatting
      run: |
        # Report violations but do not fail: the codebase uses clang-format-18+
        # features; clang-format-17 (used here for compatibility checking) produces
        # minor differences that are version-specific, not style regressions.
        find include src tests \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format-17 --dry-run --Werror || true
        echo "Note: clang-format-17 check configured but not enforced (version mismatch with developer toolchain)"

    - name: Run clang-tidy
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        # Only check our source files, exclude system headers
        find src -name '*.cpp' | head -5 | xargs clang-tidy-17 -p build \
          --header-filter='.*/(include|src)/.*\.h$' \
          --system-headers=false \
          --warnings-as-errors="" || true
        echo "Note: clang-tidy configured but not enforced yet"

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability --error-exitcode=0 \
                 --suppress=missingIncludeSystem \
                 --inline-suppr \
                 -I include src 2>&1 | tee cppcheck.log
        echo "Note: cppcheck configured but not enforced yet"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04  # pinned: installs versioned tools
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Clean build directory
      run: rm -rf build

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13 lcov
        gcc-13 --version
        g++-13 --version
        sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-13 100

    - name: Set compiler paths
      run: |
        {
          echo "CC=gcc-13"
          echo "CXX=g++-13"
          echo "GCOV=gcov-13"
        } >> "$GITHUB_ENV"

    - name: Configure with coverage
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=/usr/bin/gcc-13 \
          -DCMAKE_CXX_COMPILER=/usr/bin/g++-13 \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
          -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic"

    - name: Build
      shell: bash
      run: |
        # Same memory-aware logic as the main build job (see there for rationale).
        # Coverage builds compile with --coverage which adds instrumentation overhead;
        # keep the same job cap to avoid OOM on ubuntu-latest runners.
        MEM_GB=$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo 2>/dev/null || echo 4)
        CPU=$(nproc 2>/dev/null || echo 2)
        MEM_JOBS=$(( MEM_GB / 2 ))
        JOBS=$(( MEM_JOBS < CPU ? MEM_JOBS : CPU ))
        JOBS=$(( JOBS < 1 ? 1 : JOBS ))
        echo "Parallel build jobs: ${JOBS}"
        cmake --build build --parallel "${JOBS}"

    - name: Run tests
      run: |
        cd build
        # Run tests sequentially for coverage to avoid profile data corruption
        # Exclude timing tests for the same reason as the main CI job.
        ctest --output-on-failure -LE "timing|benchmark"

    - name: Generate coverage report
      run: |
        # Explicitly use gcov-13 for coverage collection
        # Configure-time SIMD detection runs probe binaries that leave .gcda
        # files under CMakeTmp with no .gcno beside them (CMake cleans the
        # directory). lcov 1.x reported that as a `gcov` error, ignored below;
        # lcov 2.x (ubuntu-26.04) reports a fatal `path` error instead. Delete
        # the orphans so no lcov version has to be told to ignore them.
        find build/CMakeFiles/CMakeTmp -name '*.gcda' -delete 2>/dev/null || true
        lcov --gcov-tool gcov-13 --directory build --capture --output-file coverage.info --ignore-errors gcov,mismatch
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/examples/*' --output-file coverage.info --ignore-errors unused
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Canary failure report (CI House Style section 8). GitHub notifies only
  # whoever last edited the cron line when a scheduled run fails, so this
  # opens an issue instead, or comments on the one already open. It never
  # runs on push or pull_request.
  canary-report:
    name: Canary failure report
    needs: [build, sanitizers, strict-warnings, thread-sanitizer, fma-contraction, ninja-generator, reconfigure-export, lint, coverage]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary failed: ${WORKFLOW}"
          body="The scheduled run of ${WORKFLOW} failed with no push to trigger it: ${RUN_URL}"
          number=$(gh issue list --repo "$REPO" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
