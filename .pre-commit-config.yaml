# Pre-commit hooks for libstats.
# Enable locally:  python -m pre_commit install
# Run by hand:     python -m pre_commit run --all-files
# The `precommit` job in .github/workflows/ci.yml runs this same config on
# all files; the local hook is opt-in per clone, so that job is the gate.

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Fix trailing whitespace
        # Captured tool output and bench evidence must keep its bytes.
        exclude: ^(data/profiles/|docs/bench-evidence/)
      - id: end-of-file-fixer
        name: Fix missing newline at end of file
      - id: mixed-line-ending
        name: Fix line endings to LF
        args: ['--fix=lf']
        # Two evidence files hold lone CRs (progress output) that must survive.
        exclude: ^docs/bench-evidence/
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-symlinks
        name: Check for broken symlinks
      - id: check-executables-have-shebangs
        name: Check executables have shebangs
      - id: check-shebang-scripts-are-executable
        name: Check scripts with shebangs are executable

  # C++ formatting with clang-format (the hook passes -i itself)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        name: Format C++ code with clang-format
        types_or: [c++, c]
        args: ['--style=file']
        files: \.(cpp|cc|cxx|hpp|h|hxx)$
        exclude: ^docs/bench-evidence/

  # CMake formatting with gersemi (configured in .gersemirc)
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi
        name: Format CMake files

  # Shell script checks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Check shell scripts
        args: ['--severity=warning']
        # Frozen bench evidence: 7 captured run scripts fail (e.g. SC2164, SC2079).
        exclude: ^docs/bench-evidence/

  # Markdown formatting (Ruby-based for better compatibility)
#  - repo: https://github.com/markdownlint/markdownlint
#    rev: v0.13.0
#    hooks:
#      - id: markdownlint
#        name: Lint markdown files
#        args: ["-s", ".markdownlint-style.rb"]

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        additional_dependencies: ['detect-secrets']

  # Custom local hooks for libstats-specific checks
  - repo: local
    hooks:
      - id: check-pragma-once
        name: Check for #pragma once in headers
        entry: python scripts/check_pragma_once.py
        language: python
        files: \.(h|hpp|hxx)$
        pass_filenames: true

      - id: check-copyright
        name: Check copyright headers
        entry: python scripts/check_copyright.py
        language: python
        types: [text]
        exclude: ^(\.git/|build/|third_party/|docs/archive/)

      - id: no-debug-code
        name: Check for debug code
        entry: python scripts/check_no_debug.py
        language: python
        types_or: [c++, c]
        pass_filenames: true

      - id: validate-includes
        name: Validate include order
        entry: python scripts/validate_includes.py
        language: python
        types_or: [c++, c]
        # Same scope as clang-format, whose include order this mirrors.
        exclude: ^docs/bench-evidence/
        pass_filenames: true

# Configuration for specific hooks
exclude: |
  (?x)^(
    build/.*|
    build-[^/]+/.*|
    third_party/.*|
    docs/archive/.*|
    .*\.min\.js|
    .*\.min\.css
  )$
